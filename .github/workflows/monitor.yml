name: Roam Transit availability monitor

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

concurrency:
  group: roam-transit-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check monitoring window
        id: window
        run: |
          today="$(TZ=America/Los_Angeles date +%F)"
          if [[ "$today" > "2026-09-11" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::SKIP_COMPLETION::"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.active == 'true'
        with:
          node-version: 22
      - if: steps.window.outputs.active == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.window.outputs.active == 'true'
        run: npx playwright install --with-deps chromium
      - name: Check availability without booking
        if: steps.window.outputs.active == 'true'
        run: npm run monitor
      - name: Notify only when a qualifying improvement exists
        if: steps.window.outputs.active == 'true' && hashFiles('notification.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s notification.md ]; then
            gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file notification.md
          fi
      - name: Post current availability after every successful check
        if: steps.window.outputs.active == 'true' && hashFiles('daily-summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s daily-summary.md ]; then
            gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file daily-summary.md
          fi
      - name: Persist successful inventory state
        if: steps.window.outputs.active == 'true'
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Roam Transit inventory state"
          git push
